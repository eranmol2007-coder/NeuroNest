<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dfc280;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#c9a960;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ee;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circles -->
  <circle cx="200" cy="150" r="120" fill="url(#grad1)" opacity="0.5" filter="url(#glow)"/>
  <circle cx="600" cy="400" r="150" fill="url(#grad2)" opacity="0.4" filter="url(#glow)"/>
  <circle cx="400" cy="300" r="100" fill="#7c3aed" opacity="0.2" filter="url(#glow)"/>
  
  <!-- Brain illustration -->
  <g transform="translate(300, 200)">
    <!-- Brain main shape -->
    <ellipse cx="100" cy="100" rx="90" ry="85" fill="rgba(223,194,128,0.15)" stroke="#dfc280" stroke-width="2"/>
    
    <!-- Neural connections -->
    <path d="M 60 80 Q 80 60, 100 70" stroke="#dfc280" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 100 70 Q 120 80, 140 90" stroke="#dfc280" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 70 110 Q 100 100, 130 110" stroke="#dfc280" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 80 130 Q 100 120, 120 130" stroke="#dfc280" stroke-width="1.5" fill="none" opacity="0.6"/>
    
    <!-- Neural nodes -->
    <circle cx="60" cy="80" r="4" fill="#dfc280" opacity="0.8"/>
    <circle cx="100" cy="70" r="5" fill="#f4e4c1" opacity="0.9">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="90" r="4" fill="#dfc280" opacity="0.8"/>
    <circle cx="70" cy="110" r="4" fill="#dfc280" opacity="0.8"/>
    <circle cx="130" cy="110" r="5" fill="#f4e4c1" opacity="0.9">
      <animate attributeName="r" values="5;7;5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="130" r="4" fill="#dfc280" opacity="0.8"/>
    <circle cx="120" cy="130" r="4" fill="#dfc280" opacity="0.8"/>
    
    <!-- Center glow -->
    <circle cx="100" cy="100" r="15" fill="#f4e4c1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating elements -->
  <g opacity="0.4">
    <circle cx="150" cy="450" r="6" fill="#00d4ee">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20; 0,0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="150" r="8" fill="#dfc280">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="250" r="5" fill="#a855f7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-25; 0,0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
