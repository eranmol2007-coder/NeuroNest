<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background glow -->
    <filter id="glow-gear" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
    
    <!-- 3D Inner shadow -->
    <filter id="inner-shadow-gear">
      <feOffset dx="-2" dy="-4"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.25" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
      
      <!-- Top highlight -->
      <feOffset dx="2" dy="2" in="SourceGraphic" result="top-offset"/>
      <feGaussianBlur stdDeviation="2" in="top-offset" result="top-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="top-blur" result="top-inverse"/>
      <feFlood flood-color="white" flood-opacity="0.6" result="top-color"/>
      <feComposite operator="in" in="top-color" in2="top-inverse" result="top-highlight"/>
      <feComposite operator="over" in="top-highlight" in2="shadow"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="gear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    
    <linearGradient id="center-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <g filter="url(#glow-gear)">
    <!-- Gear body with 8 teeth -->
    <path d="M40.7 54.3l-2.4-5c-2 .6-4.2.9-6.3.9s-4.3-.3-6.3-.9l-2.4 5c-1.3.4-2.6.5-3.9.5-2.8 0-5.5-.8-7.9-2.2l.6-5.5c-1.7-1.1-3.2-2.5-4.4-4.1l-5.3 1.8c-1.4-2.4-2.2-5.1-2.2-7.9 0-1.3.1-2.6.5-3.9l5-2.4c-.6-2-.9-4.2-.9-6.3s.3-4.3.9-6.3l-5-2.4c-.4-1.3-.5-2.6-.5-3.9 0-2.8.8-5.5 2.2-7.9l5.3 1.8c1.2-1.6 2.7-3 4.4-4.1l-.6-5.5c2.4-1.4 5.1-2.2 7.9-2.2 1.3 0 2.6.1 3.9.5l2.4 5c2-.6 4.2-.9 6.3-.9s4.3.3 6.3.9l2.4-5c1.3-.4 2.6-.5 3.9-.5 2.8 0 5.5.8 7.9 2.2l-.6 5.5c1.7 1.1 3.2 2.5 4.4 4.1l5.3-1.8c1.4 2.4 2.2 5.1 2.2 7.9 0 1.3-.1 2.6-.5 3.9l-5 2.4c.6 2 .9 4.2 .9 6.3s-.3 4.3-.9 6.3l5 2.4c.4 1.3.5 2.6.5 3.9 0 2.8-.8 5.5-2.2 7.9l-5.3-1.8c-1.2 1.6-2.7 3-4.4 4.1l.6 5.5c-2.4 1.4-5.1 2.2-7.9 2.2-1.3 0-2.6-.1-3.9-.5z" 
          fill="url(#gear-grad)" 
          filter="url(#inner-shadow-gear)"/>
    
    <!-- Center Hole -->
    <circle cx="32" cy="32" r="10" fill="url(#center-grad)"/>
    <!-- Center highlight ring -->
    <circle cx="32" cy="32" r="11" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  </g>
</svg>
